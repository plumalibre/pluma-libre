<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conexión con TikTok — Pluma Libre</title>
<style>body{margin:0;background:#0B2545;color:#fff;font-family:system-ui,Segoe UI,Arial,sans-serif;
display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
.c{max-width:620px;text-align:center}h1{font-size:1.3rem;margin:0 0 12px}
code{display:block;background:#08182f;border:1px solid #1d3a63;border-radius:10px;padding:16px;
margin:18px 0;word-break:break-all;font-size:.95rem;color:#F0C83C}
p{color:#c8d4e6;line-height:1.6}button{background:#F0C83C;border:0;border-radius:8px;padding:12px 20px;
font-weight:700;cursor:pointer}</style></head>
<body><div class="c">
<h1>Conexión con TikTok</h1>
<p id="msg">Leyendo la respuesta…</p>
<code id="code">—</code>
<button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copiar código</button>
<script>
var p=new URLSearchParams(location.search);
var c=p.get('code'), e=p.get('error');
document.getElementById('code').textContent = c || e || 'sin datos';
document.getElementById('msg').textContent = c
  ? 'Autorización concedida. Copiá este código y pegáselo a Claude.'
  : (e ? 'TikTok devolvió un error: ' + e : 'Esta página recibe la respuesta de TikTok.');
</script>
</div></body></html>
